<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片转3D建筑演示 · 广新栈</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0F0F1A;
  color: #E8E8E8;
  overflow: hidden;
}
#canvas-container {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
}
#loading {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #C9A961;
  font-size: 1rem;
  z-index: 100;
  text-align: center;
}
#loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(201,169,97,0.2);
  border-top-color: #C9A961;
  border-radius: 50%;
  margin: 0 auto 12px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  background: linear-gradient(to bottom, rgba(15,15,26,0.9), transparent);
  padding: 16px 20px;
  pointer-events: none;
}
.top-bar h1 {
  font-size: 1.1rem;
  color: #C9A961;
  margin-bottom: 4px;
}
.top-bar .sub {
  font-size: 0.8rem;
  color: #999;
}
.info-panel {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: 90%; max-width: 500px;
  background: rgba(26,26,46,0.92);
  border: 1px solid rgba(201,169,97,0.3);
  border-radius: 12px;
  padding: 16px 20px;
  z-index: 15;
  backdrop-filter: blur(10px);
}
.info-panel h2 {
  color: #C9A961;
  font-size: 1rem;
  margin-bottom: 8px;
}
.info-panel .tag {
  display: inline-block;
  background: rgba(200,16,46,0.25);
  color: #FF6B6B;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.72rem;
  margin-bottom: 10px;
}
.info-panel p {
  font-size: 0.85rem;
  color: #ccc;
  line-height: 1.6;
}
.info-panel .steps {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(201,169,97,0.15);
}
.info-panel .step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 0.8rem;
  color: #aaa;
}
.info-panel .step-num {
  flex-shrink: 0;
  width: 20px; height: 20px;
  background: #C8102E;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: bold;
}
.controls-hint {
  position: fixed; top: 16px; right: 16px;
  color: rgba(201,169,97,0.6);
  font-size: 0.75rem;
  z-index: 20;
  background: rgba(0,0,0,0.3);
  padding: 6px 12px;
  border-radius: 16px;
}
.back-btn {
  position: fixed; top: 16px; left: 16px;
  background: rgba(200,16,46,0.9);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  z-index: 25;
}
</style>
</head>
<body>
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <div class="controls-hint">拖动旋转 · 双指缩放</div>
  
  <div id="loading">
    <div class="spinner"></div>
    <div>加载3D模型中...</div>
  </div>

  <div id="canvas-container"></div>

  <div class="info-panel">
    <div class="tag">⭐ 简单难度 · 1小时即可完成</div>
    <h2>照片贴图3D建筑 · 广新栈</h2>
    <p>用真实照片贴在简单几何体上，快速做出有空间感的3D建筑。建筑专业同学只需提供各角度的建筑照片，就能合成3D模型用于AR展示。</p>
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div>拍照片：建筑正面、侧面、背面各一张，尽量平视、光线均匀</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>扣图修图：把建筑轮廓从背景中分离出来，调整透视</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>贴模型：搭简单体块，把照片当纹理贴到对应面上</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function() {
  const container = document.getElementById('canvas-container');
  const loading = document.getElementById('loading');
  
  // 场景
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0F0F1A);
  scene.fog = new THREE.Fog(0x0F0F1A, 10, 30);
  
  // 相机
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3, 8);
  
  // 渲染器
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);
  
  // 控制器
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI / 2.1;
  
  // 灯光
  const ambientLight = new THREE.AmbientLight(0x6A6A7A, 0.6);
  scene.add(ambientLight);
  
  const dirLight = new THREE.DirectionalLight(0xFFE4B0, 0.8);
  dirLight.position.set(5, 8, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);
  
  const fillLight = new THREE.PointLight(0xFFCC66, 0.4, 15);
  fillLight.position.set(-3, 4, -2);
  scene.add(fillLight);
  
  // 地面
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ 
    color: 0x2A2A3E,
    roughness: 0.9,
    metalness: 0.1
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  // 地面石板装饰（简单网格）
  const gridHelper = new THREE.GridHelper(10, 10, 0x3A3A5E, 0x2A2A4E);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);
  
  // 加载纹理
  const textureLoader = new THREE.TextureLoader();
  textureLoader.load(
    'assets/guangxinzhan/IMG_7900.webp',
    function(frontTexture) {
      frontTexture.colorSpace = THREE.SRGBColorSpace;
      
      // 建筑材质数组：右、左、上、下、前、后
      const materials = [
        new THREE.MeshStandardMaterial({ color: 0x4A3A25, roughness: 0.8 }), // 右面
        new THREE.MeshStandardMaterial({ color: 0x4A3A25, roughness: 0.8 }), // 左面
        new THREE.MeshStandardMaterial({ color: 0x3A2815, roughness: 0.7 }), // 顶面
        new THREE.MeshStandardMaterial({ color: 0x2A1810, roughness: 0.9 }), // 底面
        new THREE.MeshStandardMaterial({ map: frontTexture, roughness: 0.7 }), // 前面（贴照片）
        new THREE.MeshStandardMaterial({ color: 0x3A2A15, roughness: 0.8 })  // 后面
      ];
      
      // 主体建筑
      const buildingGeo = new THREE.BoxGeometry(4, 3.6, 2);
      const building = new THREE.Mesh(buildingGeo, materials);
      building.position.y = 1.8;
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
      
      // 台阶
      const stepGeo = new THREE.BoxGeometry(4.4, 0.25, 2.4);
      const stepMat = new THREE.MeshStandardMaterial({ color: 0x2A1810, roughness: 0.9 });
      const step = new THREE.Mesh(stepGeo, stepMat);
      step.position.y = 0.125;
      step.castShadow = true;
      step.receiveShadow = true;
      scene.add(step);
      
      // 屋顶（四棱锥）
      const roofGeo = new THREE.ConeGeometry(2.6, 1, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x3A2815, roughness: 0.7 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 4.1;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      scene.add(roof);
      
      // 屋顶顶端装饰
      const topGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const topMat = new THREE.MeshStandardMaterial({ color: 0xC9A961, metalness: 0.8, roughness: 0.3 });
      const top = new THREE.Mesh(topGeo, topMat);
      top.position.y = 4.65;
      scene.add(top);
      
      // 红旗
      const flagPoleGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.5);
      const flagPoleMat = new THREE.MeshStandardMaterial({ color: 0x3A2810 });
      const flagPole = new THREE.Mesh(flagPoleGeo, flagPoleMat);
      flagPole.position.set(1.8, 4.9, -0.5);
      scene.add(flagPole);
      
      const flagGeo = new THREE.PlaneGeometry(0.7, 0.45);
      const flagMat = new THREE.MeshStandardMaterial({ 
        color: 0xC8102E, 
        side: THREE.DoubleSide,
        roughness: 0.8
      });
      const flag = new THREE.Mesh(flagGeo, flagMat);
      flag.position.set(2.15, 5.3, -0.5);
      scene.add(flag);
      
      // 红旗飘动动画
      let flagTime = 0;
      
      // 隐藏loading
      loading.style.display = 'none';
      
      // 动画循环
      function animate() {
        requestAnimationFrame(animate);
        
        // 红旗飘动
        flagTime += 0.03;
        flag.rotation.y = 0.3 + Math.sin(flagTime) * 0.15;
        
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    },
    undefined,
    function(err) {
      // 纹理加载失败，显示纯色建筑
      console.error('纹理加载失败', err);
      
      const buildingGeo = new THREE.BoxGeometry(4, 3.6, 2);
      const buildingMat = new THREE.MeshStandardMaterial({ color: 0x5C4A35, roughness: 0.7 });
      const building = new THREE.Mesh(buildingGeo, buildingMat);
      building.position.y = 1.8;
      building.castShadow = true;
      scene.add(building);
      
      const stepGeo = new THREE.BoxGeometry(4.4, 0.25, 2.4);
      const stepMat = new THREE.MeshStandardMaterial({ color: 0x2A1810, roughness: 0.9 });
      const step = new THREE.Mesh(stepGeo, stepMat);
      step.position.y = 0.125;
      scene.add(step);
      
      const roofGeo = new THREE.ConeGeometry(2.6, 1, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x3A2815, roughness: 0.7 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 4.1;
      roof.rotation.y = Math.PI / 4;
      scene.add(roof);
      
      loading.innerHTML = '<div style="color:#FF6B6B">图片加载失败<br><span style="font-size:0.8rem;color:#999">显示纯色模型</span></div>';
      setTimeout(function() { loading.style.display = 'none'; }, 2000);
      
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }
  );
  
  // 窗口大小调整
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
