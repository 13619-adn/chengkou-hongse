<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F0F1A">
<title>AR实景 · 城口红迹</title>
<link rel="manifest" href="manifest.json">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0F0F1A;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  a-scene{position:fixed;top:0;left:0;width:100vw;height:100vh}

  .top-bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:14px 16px;background:linear-gradient(180deg,rgba(15,15,26,.92),rgba(15,15,26,0))}
  .back-btn{background:rgba(200,16,46,.9);color:#fff;border:none;padding:8px 16px;border-radius:20px;
    font-size:.85rem;cursor:pointer;flex-shrink:0}
  .mode-tag{color:#C9A961;font-size:.78rem;letter-spacing:1px}
  .top-actions{margin-left:auto;display:flex;gap:8px}
  .ghost-btn{background:rgba(255,255,255,.08);color:#E8DDBE;border:1px solid rgba(201,169,97,.35);
    padding:7px 12px;border-radius:18px;font-size:.75rem;cursor:pointer;backdrop-filter:blur(6px)}
  .ghost-btn:active{background:rgba(201,169,97,.2)}

  .info-card{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);
    max-width:460px;background:rgba(15,15,26,.94);border:1px solid rgba(201,169,97,.3);
    border-radius:14px;padding:16px 20px;z-index:25;backdrop-filter:blur(10px)}
  .info-card h2{color:#C9A961;font-size:1rem;margin-bottom:6px}
  .info-card .date{color:#C8102E;font-size:.76rem;margin-bottom:8px;letter-spacing:.5px}
  .info-card p{color:#c8c8c8;font-size:.82rem;line-height:1.6}

  .hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;text-align:center;
    color:rgba(201,169,97,.85);font-size:.9rem;pointer-events:none;line-height:1.7}
  .hint b{display:block;font-size:1.1rem;margin-bottom:6px;color:#E8DDBE}
  .hint.hidden{display:none}

  /* 识别图面板 */
  .marker-panel{position:fixed;inset:0;z-index:60;background:rgba(8,8,15,.96);display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .marker-panel.show{display:flex}
  .marker-box{width:min(72vw,300px);height:min(72vw,300px);background:#fff;border-radius:8px;
    padding:10px;box-shadow:0 0 40px rgba(201,169,97,.35)}
  .marker-panel h3{color:#C9A961;font-size:1rem;margin-bottom:12px;letter-spacing:1px}
  .marker-panel p{color:#aaa;font-size:.8rem;line-height:1.8;margin-top:16px;max-width:340px}
  .marker-panel .close-marker{margin-top:20px;background:#C8102E;color:#fff;border:none;
    padding:10px 26px;border-radius:22px;font-size:.85rem;cursor:pointer}

  .err{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:#0F0F1A;padding:30px;text-align:center}
  .err.show{display:flex}
  .err h3{color:#C9A961;margin-bottom:14px}
  .err p{color:#999;font-size:.85rem;line-height:1.8;max-width:340px}
  .err button{margin-top:22px;background:#C8102E;color:#fff;border:none;padding:10px 24px;
    border-radius:20px;cursor:pointer}

  @media (max-height:620px){
    .info-card{padding:10px 14px}
    .info-card p{display:none}
    .info-card h2{font-size:.9rem;margin-bottom:2px}
  }
</style>
</head>
<body>

<div id="loading" style="position:fixed;inset:0;z-index:80;background:#0F0F1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div style="width:34px;height:34px;border:3px solid rgba(201,169,97,.25);border-top-color:#C9A961;border-radius:50%;animation:gxzspin .9s linear infinite"></div>
  <p id="loadingText" style="color:#C9A961;font-size:.85rem;letter-spacing:1px">正在加载三维引擎...</p>
</div>
<style>@keyframes gxzspin{to{transform:rotate(360deg)}}</style>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← 返回</button>
  <span class="mode-tag" id="modeTag">AR 实景</span>
  <div class="top-actions">
    <button class="ghost-btn" id="btnMarker" onclick="toggleMarker(true)">识别图</button>
    <button class="ghost-btn" id="btnMode" onclick="switchMode()">切换3D</button>
  </div>
</div>

<div class="hint" id="hint">
  <b>将摄像头对准识别图</b>
  识别到方框后，模型会出现在画面上
</div>

<div class="info-card">
  <h2 id="infoTitle">加载中…</h2>
  <div class="date" id="infoDate"></div>
  <p id="infoDesc"></p>
</div>

<div class="marker-panel" id="markerPanel">
  <h3>AR 识别图</h3>
  <div class="marker-box" id="markerBox"></div>
  <p>把这张图打印出来，或用另一台设备全屏显示，<br>再用本机摄像头对准它即可看到 3D 模型。</p>
  <button class="close-marker" onclick="toggleMarker(false)">我已对准，开始</button>
</div>

<div class="err" id="errPanel">
  <h3>无法启动 AR</h3>
  <p id="errMsg">当前浏览器不支持摄像头 AR，或页面不是通过 HTTPS 打开。</p>
  <button onclick="switchMode()">改用 3D 模式查看</button>
</div>

<script src="ar-scenes.js"></script>
<script>
/* ============ 参数解析 ============ */
var params = new URLSearchParams(location.search);
var sceneId = params.get('scene') || 'guangxingzhan';
var mode = params.get('mode') === '3d' ? '3d' : 'ar';
var data = (typeof sceneData !== 'undefined') ? sceneData[sceneId] : null;

/* ============ 关闭 / 返回 ============ */
function goBack(){
  if (document.referrer && history.length > 1) history.back();
  else location.href = 'ar.html';
}

/* ============ 场景不存在 ============ */
if (!data) {
  document.getElementById('errMsg').textContent = '未找到该场景：' + sceneId;
  document.getElementById('errPanel').classList.add('show');
  document.getElementById('infoTitle').textContent = '场景不存在';
} else {
  document.getElementById('infoTitle').textContent = data.title;
  document.getElementById('infoDate').textContent = data.date;
  document.getElementById('infoDesc').textContent = data.desc;
  document.getElementById('markerBox').innerHTML = (typeof hiroMarkerSVG !== 'undefined') ? hiroMarkerSVG : '';
}

/* ============ 动态加载脚本 ============ */
function loadScript(src, timeout){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    var done = false;
    var t = setTimeout(function(){
      if (!done){ done = true; s.remove(); reject(new Error('timeout ' + src)); }
    }, timeout || 9000);
    s.src = src;
    s.onload = function(){ if (!done){ done = true; clearTimeout(t); resolve(); } };
    s.onerror = function(){ if (!done){ done = true; clearTimeout(t); reject(new Error('fail ' + src)); } };
    document.head.appendChild(s);
  });
}

/* ============ 三维预览：相机与交互 ============ */
var camEl = null, holderEl = null, sceneElRef = null;
var orbit = { theta: 0.6, phi: 0.24, dist: 6, cx: 0, cy: 1, cz: 0 };

function applyOrbit(){
  if (!camEl) return;
  var r = orbit.dist, th = orbit.theta, ph = orbit.phi;
  var x = orbit.cx + r * Math.cos(ph) * Math.sin(th);
  var y = orbit.cy + r * Math.sin(ph);
  var z = orbit.cz + r * Math.cos(ph) * Math.cos(th);
  camEl.setAttribute('position', x.toFixed(3) + ' ' + y.toFixed(3) + ' ' + z.toFixed(3));
  camEl.setAttribute('look-at', orbit.cx.toFixed(3) + ' ' + orbit.cy.toFixed(3) + ' ' + orbit.cz.toFixed(3));
}

/* 自动把镜头对准模型，解决模型过小、画面全黑 */
function frameContent(){
  if (!holderEl || !holderEl.object3D || !camEl) return;
  var box = new THREE.Box3().setFromObject(holderEl.object3D);
  if (box.isEmpty()) return;
  var size = new THREE.Vector3(); box.getSize(size);
  var center = new THREE.Vector3(); box.getCenter(center);
  var maxDim = Math.max(size.x, size.y, size.z) || 2;
  orbit.cx = center.x; orbit.cy = center.y; orbit.cz = center.z;
  orbit.dist = maxDim * 1.35 + 1.2;
  applyOrbit();
}

/* 拖拽旋转 + 滚轮/双指缩放（不依赖 orbit-controls 插件） */
function bindOrbit(){
  var canvas = sceneElRef && sceneElRef.canvas;
  if (!canvas) { setTimeout(bindOrbit, 300); return; }
  var dragging = false, lx = 0, ly = 0, pinch = 0;

  canvas.addEventListener('pointerdown', function(e){
    dragging = true; lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    orbit.theta -= dx * 0.008;
    orbit.phi = Math.max(-0.2, Math.min(1.05, orbit.phi + dy * 0.006));
    applyOrbit();
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    orbit.dist = Math.max(1.2, Math.min(80, orbit.dist * (1 + e.deltaY * 0.0012)));
    applyOrbit();
  }, { passive: false });

  canvas.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && pinch){
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
      if (d > 0){
        orbit.dist = Math.max(1.2, Math.min(80, orbit.dist * (pinch / d)));
        pinch = d; applyOrbit(); e.preventDefault();
      }
    }
  }, { passive: false });
}

/* ============ 构建场景 ============ */
function buildScene(){
  if (!data) return;
  if (document.getElementById('scene')) return;

  // 场景必须在 A-Frame 加载完成后动态创建，
  // 这样 AR.js 的属性才能在场景初始化前生效
  var sceneEl = document.createElement('a-scene');
  sceneEl.id = 'scene';
  sceneEl.setAttribute('embedded', '');
  sceneElRef = sceneEl;

  if (mode === 'ar') {
    sceneEl.setAttribute('arjs',
      'trackingMethod: best; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;');
    sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
    sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');
  }
  sceneEl.setAttribute('renderer', 'logarithmicDepthBuffer: true; antialias: true; alpha: true;');

  if (mode === 'ar') {
    document.getElementById('modeTag').textContent = 'AR 实景';
    document.getElementById('btnMode').textContent = '切换3D';
    document.getElementById('btnMarker').style.display = '';
    document.getElementById('hint').classList.remove('hidden');

    var marker = document.createElement('a-marker');
    marker.setAttribute('preset', 'hiro');
    marker.id = 'marker';
    marker.innerHTML = data.content;
    sceneEl.appendChild(marker);

    var cam = document.createElement('a-entity');
    cam.setAttribute('camera', '');
    camEl = cam;
    sceneEl.appendChild(cam);

    document.body.appendChild(sceneEl);

    // 识别到标记后隐藏提示
    setInterval(function(){
      if (!marker.object3D) return;
      if (marker.object3D.visible) document.getElementById('hint').classList.add('hidden');
      else document.getElementById('hint').classList.remove('hidden');
    }, 300);

  } else {
    document.getElementById('modeTag').textContent = '3D 预览';
    document.getElementById('btnMode').textContent = '切换AR';
    document.getElementById('btnMarker').style.display = 'none';
    document.getElementById('hint').classList.add('hidden');

    sceneEl.setAttribute('background', 'color: #16121F');

    // 地面，避免模型悬在黑色虚空里
    var ground = document.createElement('a-circle');
    ground.setAttribute('radius', '40');
    ground.setAttribute('rotation', '-90 0 0');
    ground.setAttribute('material', 'color: #1E1929; roughness: 1; metalness: 0');
    sceneEl.appendChild(ground);

    // 三盏灯：环境 + 主光 + 天光，保证不再发黑
    var amb = document.createElement('a-entity');
    amb.setAttribute('light', 'type: ambient; color: #FFF8EC; intensity: 0.85');
    sceneEl.appendChild(amb);

    var dir = document.createElement('a-entity');
    dir.setAttribute('light', 'type: directional; color: #FFE9C8; intensity: 1.25');
    dir.setAttribute('position', '5 9 7');
    sceneEl.appendChild(dir);

    var hemi = document.createElement('a-entity');
    hemi.setAttribute('light', 'type: hemisphere; color: #FFF2DC; groundColor: #3A3048; intensity: 0.55');
    sceneEl.appendChild(hemi);

    holderEl = document.createElement('a-entity');
    holderEl.innerHTML = data.content;
    sceneEl.appendChild(holderEl);

    camEl = document.createElement('a-entity');
    camEl.setAttribute('camera', 'fov: 55');
    camEl.setAttribute('position', '0 2 6');
    sceneEl.appendChild(camEl);

    document.body.appendChild(sceneEl);

    // 等模型几何体生成后再自动取景
    setTimeout(frameContent, 700);
    setTimeout(frameContent, 1800);
    setTimeout(bindOrbit, 400);
  }
}

/* ============ 启动 ============ */
(function init(){
  if (!data) return;
  var localA = 'vendor/aframe.min.js';
  var localR = 'vendor/aframe-ar.js';
  var cdnA = 'https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js';
  var cdnR = 'https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js';

  var _lt = document.getElementById('loadingText'); if (_lt) _lt.textContent = '正在加载三维引擎...';

  var chain = Promise.resolve()
    .then(function(){ return loadScript(localA, 9000); })
    .catch(function(){ return loadScript(cdnA, 15000); });

  if (mode === 'ar') {
    var _lt2 = document.getElementById('loadingText'); if (_lt2) _lt2.textContent = '正在加载 AR 组件...';
    chain = chain
      .then(function(){ return loadScript(localR, 20000); })
      .catch(function(){ return loadScript(cdnR, 25000); });
  }

  chain.then(function(){
    if (typeof AFRAME === 'undefined') throw new Error('AFRAME undefined');
    buildScene();
    var ld = document.getElementById('loading');
    if (ld) ld.style.display = 'none';
  }).catch(function(e){
    console.warn('[AR] 资源加载失败', e);
    var ld = document.getElementById('loading');
    if (ld) ld.style.display = 'none';
    document.getElementById('errMsg').textContent =
      '三维组件加载失败。请确认网络可用后刷新，或改用普通浏览器打开。';
    document.getElementById('errPanel').classList.add('show');
  });

  // 摄像头权限预检
  if (mode === 'ar') {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('errMsg').textContent =
        '当前浏览器不支持摄像头调用。建议使用 Chrome / Edge / Safari 最新版打开。';
      document.getElementById('errPanel').classList.add('show');
    } else if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      document.getElementById('errMsg').textContent =
        'AR 需要在 HTTPS 环境下才能调用摄像头，请通过 https 网址访问。';
      document.getElementById('errPanel').classList.add('show');
    }
  }
})();

/* ============ 交互 ============ */
function toggleMarker(show){
  document.getElementById('markerPanel').classList.toggle('show', show);
  if (!data || mode !== 'ar') return;
  // 识别图面板打开时暂停 AR 渲染，省电
  var sc = document.getElementById('scene');
  if (sc) sc.style.visibility = show ? 'hidden' : 'visible';
}

function switchMode(){
  mode = (mode === 'ar') ? '3d' : 'ar';
  location.href = 'ar-view.html?scene=' + encodeURIComponent(sceneId) + '&mode=' + mode;
}
</script>
</body>
</html>
